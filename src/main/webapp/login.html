<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 档案馆管理系统</title>
    <!-- Bootstrap CSS -->
    <link href="./js/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="./js/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card fade-in">
            <div class="auth-header">
                <h2><i class="bi bi-archive"></i> 档案馆</h2>
                <p>欢迎回来，请登录您的账户</p>
            </div>
            <div class="auth-body">
                <!-- Tab导航 -->
                <ul class="nav nav-tabs mb-4" id="loginTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="password-tab" data-bs-toggle="tab" data-bs-target="#password-login" type="button" role="tab">
                            <i class="bi bi-key"></i> 密码登录
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="email-tab" data-bs-toggle="tab" data-bs-target="#email-login" type="button" role="tab">
                            <i class="bi bi-envelope"></i> 邮箱验证码
                        </button>
                    </li>
                </ul>

                <!-- Tab内容 -->
                <div class="tab-content" id="loginTabContent">
                    <!-- 密码登录 -->
                    <div class="tab-pane fade show active" id="password-login" role="tabpanel">
                        <form id="passwordLoginForm">
                            <div class="mb-3">
                                <label for="username" class="form-label">
                                    <i class="bi bi-person"></i> 用户名
                                </label>
                                <input type="text" class="form-control" id="username" placeholder="请输入用户名" name="username" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    <i class="bi bi-lock"></i> 密码
                                </label>
                                <input type="password" class="form-control" id="password" placeholder="请输入密码" name="password" required>
                            </div>
                            <div class="mb-3">
                                <label for="captcha" class="form-label">
                                    <i class="bi bi-shield-check"></i> 验证码
                                </label>
                                <div class="captcha-group">
                                    <input type="text" class="form-control" id="captcha" placeholder="请输入验证码" required>
                                    <canvas id="captchaCanvas" width="120" height="40" style="border: 1px solid #ddd; border-radius: 5px; cursor: pointer;"></canvas>
                                </div>
                            </div>
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe">
                                <label class="form-check-label" for="rememberMe">
                                    记住我
                                </label>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 mb-3">
                                <i class="fas fa-sign-in-alt"></i> 登录
                            </button>
                        </form>
                    </div>

                    <!-- 邮箱验证码登录 -->
                    <div class="tab-pane fade" id="email-login" role="tabpanel">
                        <form id="emailLoginForm">
                            <div class="mb-3">
                                <label for="loginEmail" class="form-label">
                                    <i class="fas fa-envelope"></i> 邮箱地址
                                </label>
                                <input type="email" class="form-control" id="loginEmail" placeholder="请输入邮箱地址" required>
                            </div>
                            <div class="mb-3">
                                <label for="emailCode" class="form-label">
                                    <i class="fas fa-key"></i> 验证码
                                </label>
                                <div class="captcha-group">
                                    <input type="text" class="form-control" id="emailCode" placeholder="请输入邮箱验证码" required>
                                    <button type="button" class="btn btn-outline-primary" id="sendEmailCode">
                                        发送验证码
                                    </button>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 mb-3">
                                <i class="fas fa-sign-in-alt"></i> 登录
                            </button>
                        </form>
                    </div>
                </div>

                <div class="text-center mt-3">
                    <p class="mb-0">还没有账户？ <a href="register.html" class="text-primary">立即注册</a></p>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="./js/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="./js/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        $(document).ready(function() {
            // 生成验证码
            function generateCaptcha() {
                const canvas = document.getElementById('captchaCanvas');
                const ctx = canvas.getContext('2d');
                const chars = 'ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
                let captcha = '';
                
                // 清空画布
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#f0f0f0';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 生成随机验证码
                for (let i = 0; i < 4; i++) {
                    const char = chars.charAt(Math.floor(Math.random() * chars.length));
                    captcha += char;
                    
                    ctx.font = '24px Arial';
                    ctx.fillStyle = '#' + Math.floor(Math.random() * 16777215).toString(16);
                    ctx.fillText(char, 20 + i * 25, 28);
                }
                
                // 添加干扰线
                for (let i = 0; i < 3; i++) {
                    ctx.strokeStyle = '#' + Math.floor(Math.random() * 16777215).toString(16);
                    ctx.beginPath();
                    ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
                    ctx.lineTo(Math.random() * canvas.width, Math.random() * canvas.height);
                    ctx.stroke();
                }
                
                // 保存验证码
                canvas.dataset.captcha = captcha;
            }
            
            // 初始化验证码
            generateCaptcha();
            
            // 点击验证码刷新
            $('#captchaCanvas').click(function() {
                generateCaptcha();
            });
            
            // 密码登录表单提交
            $('#passwordLoginForm').submit(function(e) {
                e.preventDefault();
                
                const username = $('#username').val();
                const password = $('#password').val();
                const captcha = $('#captcha').val();
                const realCaptcha = $('#captchaCanvas').data('captcha');
                const rememberMe = $('#rememberMe').is(':checked');
                
                // 验证验证码
                if (captcha.toLowerCase() !== realCaptcha.toLowerCase()) {
                    alert('验证码错误，请重新输入！');
                    generateCaptcha();
                    $('#captcha').val('');
                    return;
                }

                const loginDate = {
                    username,
                    password
                }

                $.ajax({
                    url: "/login",
                    type: "POST",
                    contentType: "application/json; charset=utf-8",
                    data: JSON.stringify(loginDate),
                    success: function(response) {
                        let result = (typeof response === "string") ? JSON.parse(response) : response;
                        if (result.success) {
                                window.location.href = 'archives.html';
                        } else {
                            alert(result.message);
                        }
                    },
                    error: function() {
                        alert("something went wrong");
                    }
                })
            });
            
            // 发送邮箱验证码
            let countdown = 0;
            $('#sendEmailCode').click(function() {
                const email = $('#loginEmail').val();
                
                if (!email) {
                    alert('请先输入邮箱地址！');
                    return;
                }
                
                // 验证邮箱格式
                const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailPattern.test(email)) {
                    alert('邮箱格式不正确！');
                    return;
                }
                
                if (countdown > 0) {
                    return;
                }
                
                // 模拟发送验证码
                $(this).prop('disabled', true);
                countdown = 60;
                
                const timer = setInterval(() => {
                    countdown--;
                    $('#sendEmailCode').text(countdown + '秒后重发');
                    
                    if (countdown <= 0) {
                        clearInterval(timer);
                        $('#sendEmailCode').prop('disabled', false).text('发送验证码');
                    }
                }, 1000);
                
                alert('验证码已发送到您的邮箱！（模拟）');
            });
            
            // 邮箱验证码登录表单提交
            $('#emailLoginForm').submit(function(e) {
                e.preventDefault();
                
                const email = $('#loginEmail').val();
                const code = $('#emailCode').val();
                
                // 模拟验证（实际项目中应该发送到服务器验证）
                if (email && code) {
                    alert('登录成功！');
                    window.location.href = 'profile.html';
                }
            });
        });
    </script>
</body>
</html>
